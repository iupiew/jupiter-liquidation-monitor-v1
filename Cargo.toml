[package]
name = "jupiter-liquidation-monitor-v1"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
log = "0.4.29"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "macros", "chrono"] }
bs58 = "0.5.1"
base64 = "0.22.1"
borsh = "1.6.0"
borsh-derive = "1.6.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2.5"
bytes = "1.7"
regex = "1.10"
